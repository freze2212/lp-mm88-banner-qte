  <meta name="description" content="Truy cập ngay link chính thức MM88 để tránh rủi ro và bảo vệ tài khoản của bạn. Cổng kết nối bảo mật quốc tế 2026.">
  <meta name="robots" content="index, nofollow">
  <meta property="og:title" content="MM88 - Cổng Vào Chính Thức">
  <meta property="og:description" content="Truy cập ngay link chính thức MM88 - Bảo vệ tài khoản an toàn tuyệt đối.">
  <meta property="og:image" content="assets/btn-mm88.png">
  <meta name="theme-color" content="#ffffff">
  <script>
    (function() {
      var DOMAIN_MAP = {
        "mm883vip.com": "https://l0rr6.mm4111.com/register.html",
        "www.mm883vip.com": "https://l0rr6.mm4111.com/register.html",
        "mm88win.cc": "https://mm88e9e28qc.mm88cc.com/register.html",
        "www.mm88win.cc": "https://mm88e9e28qc.mm88cc.com/register.html"
      };
      var DEFAULT_URL = "https://mm88e9e28qc.mm88cc.com/register.html";

      function getTargetUrl(map) {
        var h = (window.location.hostname || "").toLowerCase().trim();
        var normH = h.replace(/^www\./, "");
        var m = map || DOMAIN_MAP;
        var entry = m[h] || m[normH] || m["www." + normH];
        if (entry) {
          return (typeof entry === "object" ? (entry.main_url || entry.url || entry.link) : entry) || DEFAULT_URL;
        }
        return m === DOMAIN_MAP ? (DOMAIN_MAP[normH] || DEFAULT_URL) : "";
      }

      var currentTarget = getTargetUrl(DOMAIN_MAP);
      window.REDIRECT_URL = currentTarget;

      function updateAllLinks(url) {
        var target = url || window.REDIRECT_URL || DEFAULT_URL;
        window.REDIRECT_URL = target;
        var links = document.querySelectorAll("a.redirect-link, a.btn-register, a.cta-btn, a.btn-link, #mainRedirectBtn");
        for (var i = 0; i < links.length; i++) {
          links[i].href = target;
          links[i].setAttribute("href", target);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function() {
          updateAllLinks(window.REDIRECT_URL);
        });
      } else {
        updateAllLinks(currentTarget);
      }

      document.addEventListener("click", function(e) {
        var btn = e.target.closest("a.redirect-link, a.btn-register, a.cta-btn, a.btn-link, #mainRedirectBtn");
        if (btn) {
          e.preventDefault();
          var destination = window.REDIRECT_URL || getTargetUrl(DOMAIN_MAP) || DEFAULT_URL;
          window.location.href = destination;
        }
      }, true);

      function fetchDomains() {
        var urls = ["./domains.json?t=" + Date.now(), "/domains.json?t=" + Date.now()];
        function tryFetch(idx) {
          if (idx >= urls.length) return;
          fetch(urls[idx], { cache: "no-store" })
            .then(function(r) { return r.json(); })
            .then(function(dj) {
              if (dj && typeof dj === "object") {
                var target = getTargetUrl(dj);
                if (target) {
                  window.REDIRECT_URL = target;
                  updateAllLinks(target);
                }
              }
            })
            .catch(function() {
              tryFetch(idx + 1);
            });
        }
        tryFetch(0);
      }
      fetchDomains();
    })();
  </script>
  <script src="config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      position: relative;
    }

    /* Video Background Container */
    .bg-video-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #f0f2f6 55%, #d9e0ea 100%);
    }


    /* Button Base */
    .btn-link {
      display: inline-block;
      text-decoration: none;
      pointer-events: auto;
      cursor: pointer;
      -webkit-user-drag: none;
      user-select: none;
      animation: zoomInOutPulse 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: center center;
      transition: transform 0.2s ease;
    }

    .btn-img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.45));
    }

    @keyframes zoomInOutPulse {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 8px rgba(230, 20, 40, 0.5));
      }
      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 20px rgba(255, 35, 55, 0.95)) drop-shadow(0 0 35px rgba(255, 215, 0, 0.4));
      }
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 8px rgba(230, 20, 40, 0.5));
      }
    }

    .btn-link:hover {
      transform: scale(1.07) !important;
    }

    .btn-link:active {
      transform: scale(0.96) !important;
    }

    /* ====================================================
       FULLSCREEN VIDEO & LAYOUT: Tràn khít 100% màn hình,
       không có khoảng trống trên/dưới hay trái/phải
       ==================================================== */
    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill; /* Giãn tràn khít tuyệt đối toàn màn hình */
      display: block;
    }

    /* ====================================================
       DESKTOP (PC): Nút nằm ở phía dưới
       ==================================================== */
    .content-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: clamp(90px, 11.5vh, 140px);
      pointer-events: none;
    }

    .btn-link {
      display: inline-block;
      width: 44%;
      max-width: 620px;
      text-decoration: none;
      pointer-events: auto;
      cursor: pointer;
      -webkit-user-drag: none;
      user-select: none;
      animation: zoomInOutPulse 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: center center;
      transition: transform 0.2s ease;
    }

    /* ====================================================
       MOBILE: BẮT BUỘC NẰM CHÍNH GIỮA MÀN HÌNH
       ==================================================== */
    @media (max-width: 768px), (orientation: portrait) {
      body .content-layer,
      body.is-mobile .content-layer {
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        justify-content: center !important;
        align-items: center !important;
        padding-bottom: 0 !important;
      }

      body .btn-link,
      body.is-mobile .btn-link {
        width: 94% !important;
        max-width: 560px !important;
        margin: 0 !important;
      }
    }

    body.is-mobile .content-layer {
      justify-content: center !important;
      align-items: center !important;
      padding-bottom: 0 !important;
    }

    body.is-mobile .btn-link {
      width: 94% !important;
      max-width: 560px !important;
      margin: 0 !important;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Video Background -->
  <div class="bg-video-wrapper">
    <video class="bg-video" id="bgVideo" autoplay loop muted playsinline webkit-playsinline preload="auto"></video>
  </div>

  <!-- Content Layer: Button sits cleanly on top of background -->
  <div class="content-layer">
    <a href="https://l0rr6.mm4111.com/register.html" class="btn-link" id="mainRedirectBtn" title="Truy cập ngay link chính thức MM88">
      <img src="assets/btn-mm88.png" alt="Truy Cập Ngay Link Chính Thức MM88 - Để Tránh Rủi Ro & Bảo Vệ Tài Khoản Của Bạn" class="btn-img" />
    </a>
  </div>

  <script>
    // Hàm nhận diện chuẩn xác thiết bị Mobile / Màn hình dọc
    function checkIsMobile() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      const isPortrait = window.matchMedia("(orientation: portrait)").matches;
      const isSmallScreen = window.innerWidth <= 768;
      return isMobileUA || isSmallScreen || (isPortrait && window.innerWidth < window.innerHeight);
    }

    const bgVideo = document.getElementById("bgVideo");

    function applyResponsiveVideo() {
      const isMobile = checkIsMobile();
      const desiredSrc = isMobile ? "assets/GT8_4793_1.mp4" : "assets/bg-video.mp4";

      if (isMobile) {
        document.body.classList.add("is-mobile");
        document.body.classList.remove("is-desktop");
      } else {
        document.body.classList.add("is-desktop");
        document.body.classList.remove("is-mobile");
      }

      if (!bgVideo.getAttribute("src") || !bgVideo.src.includes(desiredSrc)) {
        bgVideo.src = desiredSrc;
        bgVideo.load();
        const playPromise = bgVideo.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            const startPlayback = () => {
              bgVideo.play().catch(() => {});
              document.removeEventListener("touchstart", startPlayback);
              document.removeEventListener("click", startPlayback);
            };
            document.addEventListener("touchstart", startPlayback, { once: true });
            document.addEventListener("click", startPlayback, { once: true });
          });
        }
      }
    }

    // Khởi chạy ngay khi load trang
    applyResponsiveVideo();

    // Lắng nghe thay đổi kích thước hoặc xoay màn hình
    window.addEventListener("resize", applyResponsiveVideo);
    window.addEventListener("orientationchange", () => {
      setTimeout(applyResponsiveVideo, 200);
    });
  </script>
</body>
</html>
